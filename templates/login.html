{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block body %}
<div style="max-width:420px;margin:60px auto" class="card rv">
  <div style="text-align:center;font-size:2.6rem">🔒</div>
  <h2 style="text-align:center;margin:8px 0 6px">CKD<span class="grad">Predict</span></h2>
  <p class="muted small" style="text-align:center">This demo is password protected because it handles patient-style data.</p>
  <form method="post" class="mt">
    <div class="field"><label>Password</label><input type="password" name="password" required autofocus></div>
    <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:16px">Unlock</button>
  </form>
</div>
{% endblock %}
